{% if form.non_field_errors %}
  {% for error in form.non_field_errors %}<div class="field-error">{{ error }}</div>{% endfor %}
{% endif %}
{% for field in form %}
  <div class="field">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<div class="help">{{ field.help_text|safe }}</div>{% endif %}
    {% for error in field.errors %}<div class="field-error">{{ error }}</div>{% endfor %}
  </div>
{% endfor %}
