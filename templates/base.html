<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VehiCare{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='black'/><path d='M7 10l9 14 9-14' fill='none' stroke='%23d4af37' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #000000;
      --coal: #0d0d0d;
      --panel: #151515;
      --line: #2e2b22;
      --ivory: #f4efe3;
      --muted: #aaa391;
      --gold: #d4af37;
      --gold-soft: #ead489;
      --gold-deep: #a8841c;
      --ok-bg: #12261a;  --ok-ink: #9fe0b5;  --ok-line: #2f9e5b;
      --err-bg: #2c1311; --err-ink: #ffb4aa; --err-line: #d64533;
      --info-bg: #1b1a12; --info-ink: var(--gold-soft); --info-line: var(--gold);
    }
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      margin: 0; background: var(--black); color: var(--ivory);
      font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
      line-height: 1.6; min-height: 100vh;
    }
    h1, h2, h3, .brand { font-family: 'Unbounded', 'Segoe UI', sans-serif; letter-spacing: -0.02em; }
    h1 { font-size: clamp(1.6rem, 3.5vw, 2.3rem); line-height: 1.15; margin: 0 0 .6rem; font-weight: 700; }
    h2 { font-size: 1.1rem; margin: 0 0 .9rem; font-weight: 500; color: var(--gold-soft); }
    a { color: var(--gold); }
    a:hover { color: var(--gold-soft); }
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid var(--gold); outline-offset: 3px;
    }

    /* Top bar */
    .topbar {
      background: var(--black); border-bottom: 1px solid var(--gold-deep);
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; padding: .85rem 1.5rem; flex-wrap: wrap;
    }
    .brand { color: var(--ivory); text-decoration: none; font-size: 1.2rem; font-weight: 800; }
    .brand b { color: var(--gold); font-weight: 800; }
    .brand:hover { color: var(--ivory); }
    .topbar nav { display: flex; align-items: center; gap: 1.4rem; flex-wrap: wrap; }
    .topbar nav a, .linkbtn {
      color: var(--ivory); text-decoration: none; font: inherit; font-weight: 600; font-size: .95rem;
      background: none; border: 0; padding: .2rem 0; cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .topbar nav a:hover, .linkbtn:hover { color: var(--gold); border-bottom-color: var(--gold); }
    .topbar nav a.cta {
      background: var(--gold); color: var(--black); padding: .45rem 1rem; border-radius: 4px; border: 0;
    }
    .topbar nav a.cta:hover { background: var(--gold-soft); color: var(--black); }
    .topbar form { margin: 0; }

    .wrap { max-width: 980px; margin: 0 auto; padding: 2.25rem 1.25rem 4rem; }
    .lead { color: var(--muted); margin: 0 0 1.75rem; max-width: 60ch; }

    /* Messages */
    .messages { list-style: none; margin: 0 0 1.25rem; padding: 0; }
    .messages li { padding: .75rem 1rem; border-left: 4px solid; margin-bottom: .5rem; font-weight: 600; }
    .messages .success { background: var(--ok-bg); color: var(--ok-ink); border-color: var(--ok-line); }
    .messages .error { background: var(--err-bg); color: var(--err-ink); border-color: var(--err-line); }
    .messages .info, .messages .warning { background: var(--info-bg); color: var(--info-ink); border-color: var(--info-line); }

    /* Forms */
    .field { margin-bottom: 1.15rem; }
    .field label { display: block; font-weight: 600; margin-bottom: .35rem; color: var(--gold-soft); font-size: .95rem; }
    .field input[type=text], .field input[type=email], .field input[type=password] {
      width: 100%; padding: .7rem .8rem; font: inherit; color: var(--ivory);
      background: var(--panel); border: 1px solid #3a362a; border-radius: 4px;
    }
    .field input:focus { border-color: var(--gold); }
    .field input[type=file] { font: inherit; color: var(--muted); }
    .field input[type=file]::file-selector-button {
      background: var(--panel); color: var(--gold); border: 1px solid var(--gold-deep);
      padding: .4rem .8rem; border-radius: 4px; margin-right: .75rem; cursor: pointer; font: inherit; font-weight: 600;
    }
    .help { color: var(--muted); font-size: .85rem; margin-top: .3rem; }
    .help ul { margin: .25rem 0 0; padding-left: 1.1rem; }
    .field-error { color: var(--err-ink); font-size: .9rem; margin-top: .3rem; font-weight: 600; }

    .btn {
      display: inline-block; background: var(--gold); color: var(--black); border: 0;
      padding: .8rem 1.5rem; font: inherit; font-weight: 700; border-radius: 4px;
      cursor: pointer; text-decoration: none;
    }
    .btn:hover { background: var(--gold-soft); color: var(--black); }
    .btn.ghost { background: transparent; color: var(--gold); border: 1px solid var(--gold); }
    .btn.ghost:hover { background: var(--gold); color: var(--black); }

    .field select, .field input[type=number], .field input[type=date] {
      width: 100%; padding: .7rem .8rem; font: inherit; color: var(--ivory);
      background: var(--panel); border: 1px solid #3a362a; border-radius: 4px;
    }
    .field select:focus, .field input[type=number]:focus, .field input[type=date]:focus { border-color: var(--gold); }
    .field select option { background: var(--panel); color: var(--ivory); }
    .field input::placeholder { color: #6f6a5a; }

    .btn.small { padding: .4rem .85rem; font-size: .9rem; }
    .btn.danger { background: #c0392b; color: #fff; }
    .btn.danger:hover { background: #d64533; color: #fff; }
    .btn.ghost.danger-ghost { color: #ff9b8f; border-color: #8f3a30; }
    .btn.ghost.danger-ghost:hover { background: #8f3a30; color: #fff; }
    .actions-row { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
    .page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .page-head h1 { margin: 0; }
    .filters { display: flex; gap: .6rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .filters input, .filters select {
      font: inherit; color: var(--ivory); background: var(--panel); border: 1px solid #3a362a;
      border-radius: 4px; padding: .55rem .75rem;
    }
    .filters input[type=search] { flex: 1 1 220px; }
    .plate {
      display: inline-block; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
      border: 1px solid var(--gold-deep); background: var(--coal); color: var(--gold-soft);
      padding: .1rem .6rem; border-radius: 4px; white-space: nowrap;
    }
    .empty { border: 1px dashed var(--gold-deep); padding: 2.5rem 1.5rem; text-align: center; }
    .empty h2 { color: var(--ivory); font-size: 1.3rem; }
    .empty p { color: var(--muted); max-width: 44ch; margin: 0 auto 1.4rem; }
    .confirm { max-width: 560px; border-left: 4px solid #d64533; padding: .25rem 0 .25rem 1.25rem; }
    td.row-actions { white-space: nowrap; }
    td.row-actions a { margin-right: .9rem; font-weight: 600; }
    td.row-actions a.del { color: #ff9b8f; }
    .count-note { color: var(--muted); font-size: .9rem; margin: -.75rem 0 1rem; }

    /* Auth pages */
    .auth { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); min-height: 100vh; }
    .auth-side {
      background: var(--gold); color: var(--black); padding: 3rem 2.5rem;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .auth-side a.brand { color: var(--black); font-size: 1rem; }
    .auth-side .big {
      font-family: 'Unbounded', sans-serif; font-weight: 800; margin: 0;
      font-size: clamp(2.4rem, 6vw, 4.2rem); line-height: .95; letter-spacing: -0.04em;
    }
    .auth-side p { max-width: 30ch; margin: 1rem 0 0; font-weight: 600; }
    .auth-main { padding: 3rem 2.5rem; display: flex; align-items: center; background: var(--black); }
    .auth-box { width: 100%; max-width: 420px; margin: 0 auto; }
    .auth-box h2 { font-size: 1.5rem; color: var(--ivory); margin-bottom: 1.4rem; font-weight: 700; }
    .auth-box .alt { margin-top: 1.4rem; color: var(--muted); }

    /* Dashboards */
    .stats { display: flex; flex-wrap: wrap; border-top: 2px solid var(--gold); margin: 1.5rem 0 2.25rem; }
    .stat { flex: 1 1 150px; padding: 1.1rem 1.25rem 0 0; }
    .stat + .stat { padding-left: 1.25rem; border-left: 1px solid var(--line); }
    .stat b { display: block; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 2.2rem; line-height: 1.1; color: var(--gold); }
    .stat span { color: var(--muted); }

    table { width: 100%; border-collapse: collapse; background: var(--coal); }
    th, td { text-align: left; padding: .7rem .85rem; border-bottom: 1px solid var(--line); }
    th { color: var(--gold-soft); font-weight: 600; border-bottom: 1px solid var(--gold-deep); background: var(--panel); }
    tbody tr:hover { background: #141208; }
    .table-scroll { overflow-x: auto; border: 1px solid var(--line); }
    .tag { display: inline-block; padding: .1rem .65rem; border-radius: 99px; font-size: .85rem; font-weight: 700; border: 1px solid var(--gold-deep); color: var(--gold-soft); }
    .tag.admin { background: var(--gold); color: var(--black); border-color: var(--gold); }

    .profile-head { display: flex; gap: 1.25rem; align-items: center; margin-bottom: 1.75rem; }
    .avatar {
      width: 92px; height: 92px; border-radius: 50%; object-fit: cover; flex: none;
      background: var(--panel); border: 2px solid var(--gold); display: grid; place-items: center;
      font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 2rem; color: var(--gold);
    }
    .profile-head h1 { margin: 0 0 .4rem; }
    .form-narrow { max-width: 520px; }
    dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: .5rem 1.75rem; margin: 0; }
    dl.facts dt { color: var(--muted); }
    dl.facts dd { margin: 0; font-weight: 600; }

    /* Landing page */
    .hero {
      max-width: 1100px; margin: 0 auto; padding: 4.5rem 1.5rem 3.5rem;
      display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: 3rem; align-items: center;
    }
    .hero h1 { font-size: clamp(2.2rem, 5.2vw, 3.9rem); line-height: 1.05; font-weight: 800; margin-bottom: 1.2rem; }
    .hero h1 em { font-style: normal; color: var(--gold); }
    .hero p.sub { color: var(--muted); font-size: 1.1rem; max-width: 46ch; margin: 0 0 2rem; }
    .hero .actions { display: flex; gap: .9rem; flex-wrap: wrap; }

    .gauge { border: 1px solid var(--gold-deep); background: var(--coal); padding: 1.6rem; border-radius: 6px; }
    .gauge .label { color: var(--muted); font-size: .9rem; margin-bottom: .6rem; }
    .odo { display: flex; gap: 6px; margin-bottom: 1.4rem; }
    .odo span {
      flex: 1; text-align: center; font-family: 'Unbounded', sans-serif; font-weight: 700;
      font-size: clamp(1.4rem, 4vw, 2.2rem); padding: .55rem 0; border-radius: 4px;
      background: linear-gradient(#050505 0%, #1b1a15 50%, #050505 100%);
      border: 1px solid #3a362a; color: var(--gold);
    }
    .odo span.unit { flex: 0 0 auto; padding: .55rem .6rem; color: var(--muted); font-size: .9rem; align-self: end; background: none; border: 0; font-family: 'Manrope', sans-serif; }
    .bar { height: 10px; background: #26231b; border-radius: 99px; overflow: hidden; margin: .55rem 0 .35rem; }
    .bar i { display: block; height: 100%; width: 82%; background: linear-gradient(90deg, var(--gold-deep), var(--gold-soft)); }
    .gauge .row { display: flex; justify-content: space-between; color: var(--muted); font-size: .9rem; }
    .gauge .row b { color: var(--ivory); }
    .gauge .due { margin-top: 1.1rem; padding-top: 1rem; border-top: 1px solid var(--line); color: var(--ivory); font-weight: 600; }
    .gauge .due small { display: block; color: var(--muted); font-weight: 500; }

    .band { border-top: 1px solid var(--line); }
    .section { max-width: 1100px; margin: 0 auto; padding: 3.5rem 1.5rem; }
    .section > h2 { font-size: clamp(1.4rem, 3vw, 2rem); color: var(--ivory); font-weight: 700; margin-bottom: 2rem; max-width: 22ch; }
    .tracks { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 2.5rem; }
    .tracks div { border-left: 3px solid var(--gold); padding-left: 1.1rem; }
    .tracks h3 { margin: 0 0 .5rem; font-size: 1.05rem; font-weight: 700; color: var(--gold-soft); }
    .tracks p { margin: 0; color: var(--muted); }
    .steps { list-style: none; margin: 0; padding: 0; counter-reset: step; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; }
    .steps li { counter-increment: step; }
    .steps li::before {
      content: counter(step); display: grid; place-items: center; width: 2.4rem; height: 2.4rem;
      border: 1px solid var(--gold); border-radius: 50%; color: var(--gold);
      font-family: 'Unbounded', sans-serif; font-weight: 700; margin-bottom: .9rem;
    }
    .steps b { display: block; font-size: 1.05rem; margin-bottom: .3rem; }
    .steps span { color: var(--muted); }
    .closing { background: var(--gold); color: var(--black); }
    .closing .section { display: flex; align-items: center; justify-content: space-between; gap: 2rem; flex-wrap: wrap; padding: 3rem 1.5rem; }
    .closing h2 { color: var(--black); margin: 0; max-width: 24ch; font-size: clamp(1.3rem, 3vw, 1.9rem); font-weight: 800; }
    .closing .btn { background: var(--black); color: var(--gold); }
    .closing .btn:hover { background: #1b1a15; color: var(--gold-soft); }
    footer.foot { text-align: center; padding: 1.5rem; color: var(--muted); font-size: .85rem; }

    @media (max-width: 800px) {
      .auth { grid-template-columns: 1fr; min-height: 0; }
      .auth-side { padding: 1.75rem 1.5rem; gap: 1.25rem; }
      .auth-main { padding: 2rem 1.5rem; }
      .stat + .stat { border-left: 0; padding-left: 0; }
      .hero { grid-template-columns: 1fr; padding-top: 2.5rem; gap: 2.25rem; }
      .tracks, .steps { grid-template-columns: 1fr; gap: 1.75rem; }
    }
  </style>
</head>
<body>
  {% block body %}
  {% include '_topbar.html' %}
  <main class="wrap">
    {% include 'messages.html' %}
    {% block content %}{% endblock %}
  </main>
  {% endblock %}
</body>
</html>
