{% extends 'base.html' %}
{% block title %}{{ heading }} · VehiCare{% endblock %}
{% block content %}
<div class="page-head"><h1>{{ heading }}</h1></div>
<form method="post" class="form-narrow" novalidate>
  {% csrf_token %}
  {% include 'accounts/_form_fields.html' %}
  <div class="actions-row">
    <button type="submit" class="btn">{{ submit }}</button>
    <a class="btn ghost" href="{% if vehicle %}{% url 'vehicles:detail' vehicle.pk %}{% else %}{% url 'vehicles:list' %}{% endif %}">Cancel</a>
  </div>
</form>
{% endblock %}
